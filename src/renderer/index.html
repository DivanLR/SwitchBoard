    <!--
      DIRECTION CONTRACT — THE TRACE, ON A LIGHT BENCH

      AMENDED 2026-08-21. The owner asked for a modern surface against a named
      reference (design.dev/tools) and chose a full departure rather than a
      refinement. LIGHT is now the default theme: a pale grey canvas carrying
      white cards, 10px corners, soft low-alpha depth, generous spacing. The dark
      instrument below is still built and still one click away, and its rules are
      unchanged; it is simply no longer the ground a new install opens on. The
      thesis that survives both worlds is the last line of it: colour is spent
      only on a reading outside tolerance.

      THE ORIGINAL CONTRACT, still governing the dark theme:

      THESIS: An instrument screen. Hairline traces on a measurement grid, and
      colour spent solely on a measurement outside tolerance. It refuses the
      console-with-one-neon-accent and the white-card dashboard alike, and it
      refuses its own predecessor: no pixel grid, no dither, no bitmap face.

      OWN-WORLD: Neutral charcoal ground, never navy and never pure black, ruled
      by a faint graticule. One accent for the live trace; every other colour is
      earned by being out of tolerance. System face throughout at 11 to 13px;
      monospace only where there are numbers. Hairline lip for depth, 3px radius,
      no gradient and no glow.

      STORY: The supervisor sees which lane is out of tolerance and answers it
      without opening each in turn.

      FIRST VIEWPORT: Three panes on one graticule. Left, one trace per project,
      flat while idle and stepping when the session acts, so activity reads as
      shape before it reads as text. Centre, the opened channel. Right, the
      decisions, each one a reading outside tolerance. Status row across the foot.

      FORM: The Trace, chosen by the developer from the familiar register, which
      suspends the roll and hands the pick to them. Seed a2e3145d.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
    -->
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
</body>
