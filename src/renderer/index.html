      DIRECTION CONTRACT — THE DEPLOYABLE SHEET
      Chosen by the developer from a dealt hand, roll two, seed 02478bcf.

      THESIS: A scored sheet, folded flat and deployed by one pull. It refuses the
      dark-IDE-plus-neon default and the white SaaS dashboard alike, and it refuses
      the outgoing music-engraving world outright: no notation, no metaphor anyone
      has to be taught.

      OWN-WORLD: Sheet white or carbon-fibre ground; foil green as the one action
      (AMENDED from foil gold at the owner's direction; see --green in styles.css);
      valley blue for attention owed; mountain gray as structure; red-pencil
      correction for error. Corners are chamfered, never rounded, because a fold is
      a cut. Hairlines terminate at an angle. Identifiers carry mono spec labels the
      way a crease carries M-128. A faint 60-degree crease lattice rules the ground.

      STORY: The developer sees which lane is folded, deployed, or needs them, and
      answers it in one place without opening each in turn.

      FIRST VIEWPORT: Three panes, unchanged. Left, one lane per project: a state
      lamp, a nameplate legend, a mono id. Centre stays deliberately empty for the
      work in hand. Right, the decision panel.

      FORM: The Deployable Sheet, candidate 4 of the grounded list, user-chosen over
      the roll's assignment. Staged as the peg rail: the centre is reserved for the
      work and everything else hangs on the perimeter at one ordained height.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
