appId: com.haefelesoftware.switchboard
productName: Switchboard
copyright: Copyright © 2026 Haefele Software

directories:
  output: release
  buildResources: build

# Keep the default inclusion (production dependencies are detected and bundled
# automatically) and only exclude source and tooling that the runtime never loads.
files:
  - out/**
  - '!**/*.map'
  # Do NOT bundle the Agent SDK's standalone Claude Code CLI (~245 MB per
  # platform). The app drives the user's own installed `claude` (which every
  # Switchboard user has); resolveClaudeExecutable prefers it, and startSession
  # errors clearly if it is missing. This roughly halves the packaged size.
  - '!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'

# No native modules: the SQLite store runs on the runtime's own `node:sqlite`,
# so there is nothing to rebuild per ABI and nothing to unpack from the asar.

# Harden the packaged binary so it cannot be relaunched to run arbitrary Node
# code (Electron security checklist A19). The app needs neither fuse: it spawns
# the standalone Claude CLI and stores data through `node:sqlite`.
# electron-builder flips these itself, so there is no afterPack hook and no
# @electron/fuses dependency.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false

# The GitHub release feed electron-updater reads (also writes app-update.yml into
# the package). Releases are published manually, so BOTH artefacts must be
# attached to every release: the NSIS installer AND the generated
# release/latest.yml. Without latest.yml the in-app updater cannot resolve a new
# version, and it is also where the SHA-512 it verifies the download against
# lives.
publish:
  provider: github
  owner: DivanLR
  repo: SwitchBoard

# switchboard:// protocol — notification Approve buttons activate through it.
protocols:
  - name: Switchboard
    schemes:
      - switchboard

win:
  # Only the NSIS installer is shipped — no portable build.
  target:
    - target: nsis
  icon: build/icon.ico
  # NOT CODE-SIGNED. Windows SmartScreen warns on first run, and auto-update
  # integrity therefore rests entirely on the SHA-512 in latest.yml — a hash
  # published alongside the very release it validates, which protects against a
  # corrupted download but not against a compromised release step.
  #
  # Signing needs a certificate that must be bought; it cannot be configured from
  # the repo alone. When one exists, either:
  #   - a traditional OV/EV certificate: set CSC_LINK and CSC_KEY_PASSWORD in the
  #     build environment and electron-builder signs automatically; or
  #   - Azure Trusted Signing: add an `azureSignOptions` block here, which avoids
  #     holding a certificate file at all.
  # EV and Azure Trusted Signing clear the SmartScreen warning immediately; a
  # plain OV certificate has to accumulate reputation first.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: Switchboard
  # Full download only: a differential update needs the previous release's
  # .blockmap attached as well, and releases carry just the installer plus
  # latest.yml. electron-updater falls back to the full installer either way.
  differentialPackage: false
